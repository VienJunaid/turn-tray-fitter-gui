name: Build Windows Executable 

on: 
  push: 
    branches: [main] 
  workflow_dispatch: 

jobs:
  build: 
    runs-on: windows-latest 
    steps: 
      - uses: actions/checkout@v4 

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12"

      - run: pip install -r requirements.txt pyinstaller 

      - run: >
          pyinstaller --onefile --windowed 
          --name "TurnTrayFitter" 
          --icon "MVE logos/icon_blue.ico" 
          --add-data "freezer_models.json;."
          --add-data "MVE logos;MVE logos" 
          turn_tray_visualizer.py 

      - uses: actions/upload-artifact@v4 
        with: 
          name: TurnTrayFitter-windows
          path: dist/TurnTrayFitter.exe 

